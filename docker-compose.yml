services:
  db:
    image: mariadb:10.6
    restart: no
    volumes:
      - dbstore:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: notSecureChangeMe
  site:
    depends_on:
      - db
    image: php-fsu25d:local
    restart: no
    volumes:
      - ./html:/var/www/html
    ports:
      - 8080:80
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: notSecureChangeMe
  phpmyadmin:
    depends_on:
      - db
    image: phpmyadmin
    restart: no
    ports:
      - 8081:80
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: notSecureChangeMe
volumes:
  dbstore: