services:
  db:
    image: mariadb:10.6
    restart: no
    volumes:
      - dbstore:/var/lib/mysql
      - ./faceit-backup.sql:/docker-entrypoint-initdb.d/01-faceit.sql:ro

    environment:
      MYSQL_ROOT_PASSWORD: notSecureChangeMe
      MYSQL_DATABASE: faceit
  site:
    depends_on:
      - db
    build: .
    image: php-fsu25d:local
    restart: no
    volumes:
      - ./html:/var/www/html
    ports:
      - 8080:80
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: notSecureChangeMe
  phpmyadmin:
    depends_on:
      - db
    image: phpmyadmin
    restart: no
    ports:
      - 8081:80
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: notSecureChangeMe
volumes:
  dbstore: